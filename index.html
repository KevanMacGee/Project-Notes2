<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid py-4">
      <h1 class="mb-4 text-center">Horizontal Kanban Board</h1>

      <!-- Task Form -->
      <div class="row mb-4">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Add New Task</h5>
            </div>
            <div class="card-body">
              <form id="task-form">
                <div class="row g-3">
                  <div class="col-md-4">
                    <input type="text" class="form-control" id="task-title" placeholder="Task Title" required />
                  </div>
                  <div class="col-md-6">
                    <input type="text" class="form-control" id="task-description" placeholder="Task Description" />
                  </div>
                  <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add Task</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Kanban Rows -->
      <div class="kanban-board">
        <!-- To Do Row -->
        <div class="row mb-2">
          <div class="col-12">
            <div class="kanban-row todo-row">
              <div class="d-flex">
                <div class="row-title">To Do</div>
                <div class="row-container" id="todo-row" data-row="todo"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- In Progress Row -->
        <div class="row mb-2">
          <div class="col-12">
            <div class="kanban-row inprogress-row">
              <div class="d-flex">
                <div class="row-title">In Progress</div>
                <div class="row-container" id="inprogress-row" data-row="inprogress"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Done Row -->
        <div class="row mb-2">
          <div class="col-12">
            <div class="kanban-row done-row">
              <div class="d-flex">
                <div class="row-title">Done</div>
                <div class="row-container" id="done-row" data-row="done"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Holding Area Row -->
        <div class="row mb-2">
          <div class="col-12">
            <div class="kanban-row holding-row">
              <div class="d-flex">
                <div class="row-title">Holding Area</div>
                <div class="row-container" id="holding-row" data-row="holding"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Modules -->
    <script src="js/storage.js"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/dragAndDrop.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
