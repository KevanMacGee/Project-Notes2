<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Row-Based Kanban Board</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Drag-and-Drop Kanban Board (Rows)</h1>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">
          <i class="bi bi-plus-lg"></i> Add Task
        </button>
      </div>

      <!-- Kanban Board with Four Rows -->
      <div id="board">
        <div class="board-row">
          <h3 class="row-title">To Do</h3>
          <div class="status-row todo">
            <div class="task-container" id="todo"></div>
          </div>
        </div>

        <div class="board-row">
          <h3 class="row-title">In Progress</h3>
          <div class="status-row in-progress">
            <div class="task-container" id="in-progress"></div>
          </div>
        </div>

        <div class="board-row">
          <h3 class="row-title">Done</h3>
          <div class="status-row done">
            <div class="task-container" id="done"></div>
          </div>
        </div>

        <div class="board-row">
          <h3 class="row-title">Holding Area</h3>
          <div class="status-row holding">
            <div class="task-container" id="holding"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="taskModalLabel">Create New Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="taskForm">
              <div class="mb-3">
                <label for="taskContent" class="form-label">Task Content</label>
                <textarea
                  class="form-control"
                  id="taskContent"
                  rows="3"
                  placeholder="Enter task content"
                  required
                ></textarea>
              </div>
              <div class="modal-footer px-0 pb-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Task</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="app.js"></script>
    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
