<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Row-Based Kanban Board</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container my-4">
      <h1 class="text-center mb-4">Drag-and-Drop Kanban Board (Rows)</h1>

      <!-- Task Creation Form -->
      <div class="card mb-4">
        <div class="card-body">
          <form id="taskForm">
            <div class="mb-3">
              <label for="taskTitle" class="form-label">Task Title</label>
              <input type="text" class="form-control" id="taskTitle" placeholder="Enter task title" required />
            </div>
            <div class="mb-3">
              <label for="taskDescription" class="form-label">Task Description</label>
              <textarea
                class="form-control"
                id="taskDescription"
                rows="3"
                placeholder="Enter task description"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
          </form>
        </div>
      </div>

      <!-- Kanban Board with Four Rows -->
      <div id="board">
        <div class="status-row todo">
          <h3>To Do</h3>
          <div class="task-container" id="todo"></div>
        </div>
        <div class="status-row in-progress">
          <h3>In Progress</h3>
          <div class="task-container" id="in-progress"></div>
        </div>
        <div class="status-row done">
          <h3>Done</h3>
          <div class="task-container" id="done"></div>
        </div>
        <div class="status-row holding">
          <h3>Holding Area</h3>
          <div class="task-container" id="holding"></div>
        </div>
      </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="app.js"></script>
    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
